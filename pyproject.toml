[project]
name = "agent-console"
version = "0.1.0"
description = "Document ingestion and hybrid knowledge retrieval for the Pi-based Ergouzi assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-community>=0.2.12",
    "dashscope>=1.25.18",
    "langchain-text-splitters>=0.2.2",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.31",
    "PyMuPDF",
    "python-pptx",
    "python-docx",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pywin32>=306; sys_platform == 'win32'",
    "langchain_deepseek",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = ["httpx>=0.27.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
