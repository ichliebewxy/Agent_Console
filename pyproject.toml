[project]
name = "nebulanest-agent-console"
version = "0.1.0"
description = "A local Agent and RAG console with hybrid retrieval, tool callbacks, and human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "fastapi>=0.115.0",
    "starlette>=1.0.1",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "aiohttp>=3.13.4",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.27",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=1.3.3",
    "langchain-community>=0.2.12",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.1.14",
    "langchain-deepseek>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.2.31",
    "langsmith>=0.8.0",
    "dashscope>=1.23.0",
    "pymupdf>=1.24.0",
    "pypdf>=6.10.2",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "lxml>=6.1.0",
    "pillow>=12.2.0",
    "pygments>=2.20.0",
    "docx2txt>=0.8",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
study = [
    "langchain-classic>=0.2.0",
    "chromadb>=0.5.5",
    "bilibili-api-python>=17.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E402", "E501", "B008", "B904", "B905"]
